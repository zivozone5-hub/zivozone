<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
<defs>
 <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop stop-color="#5b0712"/><stop offset=".38" stop-color="#21030a"/><stop offset="1" stop-color="#020205"/></radialGradient>
 <radialGradient id="skull" cx="45%" cy="30%" r="70%"><stop stop-color="#fff6df"/><stop offset=".35" stop-color="#b9a99a"/><stop offset=".72" stop-color="#514a49"/><stop offset="1" stop-color="#171519"/></radialGradient>
