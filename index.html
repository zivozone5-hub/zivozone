<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIVOZONE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 25px 18px;
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-top: 35px;
}

.logo span {
    font-size: 15px;
    display: block;
    opacity: .65;
    letter-spacing: 3px;
}

.card {
    background: #151c32;
    border-radius: 24px;
    padding: 25px;
    margin-top: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h1, h2 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #b8c0d9;
    line-height: 1.8;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 15px;
    margin-top: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #ffffff;
    color: #0b1020;
}

.option {
    background: #222b48;
    color: white;
    text-align: right;
}

.option:hover {
    background: #303b60;
}

.correct {
    background: #238636 !important;
}

.wrong {
    background: #c62828 !important;
}

.topbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    color: #dce2f5;
}

.timer {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

.progress {
    height: 7px;
    background: #303951;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: white;
}

.hidden {
    display: none;
}

.result {
    text-align: center;
}

.score {
    font-size: 55px;
    font-weight: 900;
    margin: 20px;
}

.small {
    color: #9da7c1;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="home">
        <div class="logo">
            ZIVOZONE
            <span>PLAY • COMPETE • WIN</span>
        </div>

        <div class="card">
            <h1>⚡ تحدي السرعة</h1>

            <p class="subtitle">
                هل تستطيع الإجابة بسرعة قبل انتهاء الوقت؟
                <br>
                اختبر معلوماتك واجمع أكبر عدد من النقاط.
            </p>

            <button class="start" onclick="startGame()">
                ابدأ التحدي 🚀
            </button>
        </div>
    </div>

    <!-- GAME -->
    <div id="game" class="hidden">

        <div class="logo">
            ZIVOZONE
        </div>

        <div class="card">

            <div class="topbar">
                <div>النقاط: <b id="score">0</b></div>
                <div>السؤال <b id="questionNumber">1</b>/5</div>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="timer" id="timer">10</div>

            <h2 id="question"></h2>

            <div id="options"></div>

        </div>
    </div>

    <!-- RESULT -->
    <div id="result" class="hidden">

        <div class="logo">
            ZIVOZONE
        </div>

        <div class="card result">

            <h1>🏆 انتهى التحدي!</h1>

            <div class="score" id="finalScore">0</div>

            <p>نقاطك من 50</p>

            <p class="subtitle" id="message"></p>

            <button class="start" onclick="restartGame()">
                العب مرة أخرى 🔥
            </button>

        </div>
    </div>

</div>

<script>

const questions = [
    {
        question: "ما عاصمة الأردن؟",
        options: ["عمّان", "القاهرة", "الرياض", "بغداد"],
        answer: 0
    },
    {
        question: "كم عدد لاعبي فريق كرة القدم داخل الملعب؟",
        options: ["9", "10", "11", "12"],
        answer: 2
    },
    {
        question: "ما الكوكب المعروف بالكوكب الأحمر؟",
        options: ["الأرض", "المريخ", "المشتري", "الزهرة"],
        answer: 1
    },
    {
        question: "كم يساوي 7 × 8؟",
        options: ["54", "56", "64", "48"],
        answer: 1
    },
    {
        question: "من فاز بكأس العالم 2022؟",
        options: ["فرنسا", "الأرجنتين", "البرازيل", "ألمانيا"],
        answer: 1
    }
];

let currentQuestion = 0;
let score = 0;
let timeLeft = 10;
let timer;
let answered = false;

function startGame() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    showQuestion();
}

function showQuestion() {

    answered = false;
    timeLeft = 10;

    clearInterval(timer);

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        currentQuestion + 1;

    document.getElementById("score").innerText = score;

    document.getElementById("question").innerText =
        q.question;

    document.getElementById("timer").innerText =
        timeLeft;

    document.getElementById("progress").style.width =
        ((currentQuestion) / questions.length * 100) + "%";

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.innerText = option;

        button.onclick = () => selectAnswer(index, button);

        optionsContainer.appendChild(button);
    });

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("timer").innerText =
            timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            if (!answered) {
                answered = true;

                document.querySelectorAll(".option")
                    .forEach(btn => btn.disabled = true);

                setTimeout(nextQuestion, 700);
            }
        }

    }, 1000);
}

function selectAnswer(index, button) {

    if (answered) return;

    answered = true;

    clearInterval(timer);

    const q = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(btn => btn.disabled = true);

    if (index === q.answer) {

        button.classList.add("correct");

        // كلما كانت الإجابة أسرع، النقاط أعلى
        const points = 10 + timeLeft;

        score += points;

    } else {

        button.classList.add("wrong");

        buttons[q.answer].classList.add("correct");
    }

    document.getElementById("score").innerText = score;

    setTimeout(nextQuestion, 900);
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        finishGame();

    } else {

        showQuestion();
    }
}

function finishGame() {

    clearInterval(timer);

    document.getElementById("game").classList.add("hidden");

    document.getElementById("result").classList.remove("hidden");

    document.getElementById("finalScore").innerText =
        score;

    let message = "";

    if (score >= 80) {
        message = "🔥 أداء قوي جدًا! أنت لاعب ZIVOZONE حقيقي.";
    } else if (score >= 50) {
        message = "👏 ممتاز! لكن تستطيع الوصول إلى مستوى أعلى.";
    } else {
        message = "💪 حاول مرة أخرى وشاهد إذا كنت تستطيع تحطيم نتيجتك.";
    }

    document.getElementById("message").innerText =
        message;
}

function restartGame() {

    document.getElementById("result").classList.add("hidden");

    document.getElementById("game").classList.remove("hidden");

    startGame();
}

</script>

</body>
</html>
