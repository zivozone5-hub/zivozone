<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZIVOZONE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;
    background: linear-gradient(135deg, #080b16, #151b32);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 520px;
    text-align: center;
}

.logo {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 35px;
}

.card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}

h1 {
    margin-top: 0;
    font-size: 27px;
}

.description {
    color: #bbb;
    line-height: 1.8;
}

input {
    width: 100%;
    padding: 15px;
    margin: 20px 0 12px;
    border-radius: 12px;
    border: none;
    outline: none;
    text-align: center;
    font-size: 17px;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #5865f2;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.hidden {
    display: none;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    color: #ccc;
}

.player {
    color: #fff;
    font-weight: bold;
}

.progress {
    height: 7px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;
    width: 20%;
    background: #5865f2;
    transition: width 0.3s;
}

.question-number {
    color: #aaa;
    margin-bottom: 10px;
}

.question {
    font-size: 25px;
    font-weight: bold;
    margin: 20px 0 25px;
}

.answer {
    background: rgba(255,255,255,0.08);
    margin: 10px 0;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: rgba(88,101,242,0.5);
}

.correct {
    background: #16834b !important;
}

.wrong {
    background: #b83232 !important;
}

.score {
    font-size: 20px;
    margin-top: 20px;
}

.final-score {
    font-size: 32px;
    font-weight: bold;
    margin: 25px 0;
}

.small {
    color: #aaa;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <!-- البداية -->
    <div id="startScreen" class="card">

        <div class="logo">ZIVOZONE</div>

        <div class="subtitle">
            PLAY • COMPETE • WIN
        </div>

        <h1>تحدي السرعة ⚡</h1>

        <p class="description">
            اختبر معلوماتك وسرعتك وأثبت أنك الأفضل!
        </p>

        <input
            id="playerName"
            type="text"
            maxlength="20"
            placeholder="اكتب اسمك هنا"
        >

        <button onclick="startGame()">
            🚀 ابدأ التحدي
        </button>

    </div>


    <!-- اللعبة -->
    <div id="gameScreen" class="card hidden">

        <div class="top">

            <div>
                اللاعب:
                <span id="playerDisplay" class="player"></span>
            </div>

            <div>
                النقاط:
                <span id="scoreDisplay">0</span>
            </div>

        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionNumber" class="question-number">
            السؤال 1/5
        </div>

        <div id="question" class="question"></div>

        <div id="answers"></div>

    </div>


    <!-- النتيجة -->
    <div id="resultScreen" class="card hidden">

        <div class="logo">ZIVOZONE</div>

        <h1>🏆 انتهى التحدي!</h1>

        <p>
            أحسنت يا
            <strong id="finalPlayer"></strong>
        </p>

        <div class="final-score">
            <span id="finalScore"></span>
            نقطة
        </div>

        <p class="small">
            هل تستطيع تحقيق نتيجة أفضل؟
        </p>

        <button onclick="restartGame()">
            🔄 العب مرة أخرى
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "ما عاصمة الأردن؟",
        answers: ["عمّان", "القاهرة", "الرياض", "بغداد"],
        correct: 0
    },

    {
        question: "كم عدد أيام الأسبوع؟",
        answers: ["5", "6", "7", "8"],
        correct: 2
    },

    {
        question: "ما أكبر قارة في العالم؟",
        answers: ["أفريقيا", "آسيا", "أوروبا", "أستراليا"],
        correct: 1
    },

    {
        question: "كم يساوي 5 × 5؟",
        answers: ["15", "20", "25", "30"],
        correct: 2
    },

    {
        question: "ما الكوكب المعروف بالكوكب الأحمر؟",
        answers: ["المريخ", "الأرض", "الزهرة", "المشتري"],
        correct: 0
    }

];


let playerName = "";
let currentQuestion = 0;
let score = 0;
let answered = false;


function startGame() {

    const input = document.getElementById("playerName");

    playerName = input.value.trim();

    if (playerName === "") {

        alert("اكتب اسمك أولاً!");

        input.focus();

        return;
    }

    currentQuestion = 0;
    score = 0;

    document.getElementById("startScreen").classList.add("hidden");

    document.getElementById("resultScreen").classList.add("hidden");

    document.getElementById("gameScreen").classList.remove("hidden");

    document.getElementById("playerDisplay").textContent = playerName;

    document.getElementById("scoreDisplay").textContent = score;

    showQuestion();
}


function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "السؤال " + (currentQuestion + 1) + "/" + questions.length;

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";


    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";


    q.answers.forEach((answer, index) => {

        const button = document.createElement("div");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {

            selectAnswer(button, index);

        };

        answersContainer.appendChild(button);

    });

}


function selectAnswer(button, selectedIndex) {

    if (answered) {
        return;
    }

    answered = true;

    const q = questions[currentQuestion];

    const allAnswers =
        document.querySelectorAll(".answer");


    if (selectedIndex === q.correct) {

        button.classList.add("correct");

        score += 10;

    } else {

        button.classList.add("wrong");

        allAnswers[q.correct].classList.add("correct");

    }


    document.getElementById("scoreDisplay").textContent = score;


    setTimeout(function() {

        currentQuestion++;

        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            finishGame();

        }

    }, 800);

}


function finishGame() {

    document.getElementById("gameScreen").classList.add("hidden");

    document.getElementById("resultScreen").classList.remove("hidden");

    document.getElementById("finalPlayer").textContent =
        playerName;

    document.getElementById("finalScore").textContent =
        score;

}


function restartGame() {

    document.getElementById("resultScreen").classList.add("hidden");

    document.getElementById("startScreen").classList.remove("hidden");

    document.getElementById("playerName").value = "";

}


</script>

</body>
</html>
