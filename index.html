<script>
/* ZIVOZONE V47 — runtime guard */
(function(){
  function release(){
    var el=document.getElementById('app-loader');
    if(el) el.classList.add('hidden');
  }
  window.addEventListener('error',function(e){
    console.error('ZIVOZONE runtime error:',e.error||e.message);
    release();
  });
  window.addEventListener('unhandledrejection',function(e){
    console.error('ZIVOZONE promise error:',e.reason);
    release();
  });
  setTimeout(release,1800);
})();
</script>

<script>
(function(){
 function boot(){
  const s=document.getElementById('zivo-lang-select');
  if(!s)return;
  const go=()=>{if(window.ZIVOLanguage)window.ZIVOLanguage.set(s.value);};
  s.value=window.ZIVOLanguage?.get?.()||localStorage.getItem('zivozone-language')||'ar';
  s.addEventListener('change',go);
  document.addEventListener('zivo:language',e=>{s.value=e.detail.code});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
